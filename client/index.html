  <body>
    <div id="root"></div>
    <!-- Pinch-to-zoom is owned by the viewport meta tag above, and only
         there. minimum-scale=1.0 / maximum-scale=5.0 with no
         user-scalable=no lets WebKit run its own bounded zoom.

         This comment used to claim the meta carried user-scalable=no and
         that MainViewController.swift owned pinch instead. Both halves
         stopped being true on 2026-06-23 (bda6fb81), which reopened the
         meta without removing the Swift override — so for months the
         scroll view's delegate was hijacked while WebKit was perfectly
         able to handle the gesture itself. The override is gone now;
         webView.scrollView zoom IS viewport zoom, never a second engine.

         Do not add user-scalable=no back. WebKit refuses pinch outright
         when the page forbids scaling, which is what sent this down the
         native-override path in the first place. -->

    <script type="module" src="/src/main.jsx"></script>
  </body>
